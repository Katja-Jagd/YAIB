# WandB sweep configuration for BAT supervised learning
# Dataset: HiRID
# Task: AKI (Acute Kidney Injury prediction)
# Model: BAT (from scratch, not SSL pretrained)

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/aki_from_katja/hirid
  - -n
  - hirid
  - -t
  - AKI
  - -m
  - BAT
  - -gc
  - -lc
  - -l
  - ../yaib_logs_bat_supervised_hirid_aki/
  - --wandb-sweep

method: random
metric:
  name: avg.auroc
  goal: maximize

name: bat_hirid_aki_supervised

early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  # Training hyperparameters
  train_common.epochs:
    value: 15

  train_common.batch_size:
    values: [4, 8, 16, 32, 64]

  train_common.patience:
    value: 10

  train_common.min_delta:
    value: 1e-4

  # Optimizer hyperparameters
  Adam.lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4

  Adam.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4

  # Model architecture hyperparameters (BAT-specific)
  model/hyperparameter.value_embed_size:
    values: [16, 64, 128]

  model/hyperparameter.heads:
    values: [1, 2, 4]

  model/hyperparameter.layers:
    values: [2, 6, 12]

  model/hyperparameter.dropout:
    values: [0.1, 0.2, 0.4]

  model/hyperparameter.attn_dropout:
    values: [0.1, 0.2, 0.4]

  # Cross-validation settings
  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 1

  execute_repeated_cv.stop_after_first_fold:
    value: True

  # Seed
  seed:
    value: 2222
