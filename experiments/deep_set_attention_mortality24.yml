# WandB sweep configuration for Deep Set Attention supervised learning
# Dataset: HiRID
# Task: Mortality24 (24-hour mortality prediction)
# Model: Deep Set Attention (SEFT-based)

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/hirid
  - -n
  - hirid
  - -t
  - Mortality24
  - -m
  - DeepSetAttention
  - -gc
  - -lc
  - -l
  - ../yaib_logs_deep_set_attention_supervised_hirid_mortality24/
  - --wandb-sweep

method: random
metric:
  name: avg.auroc
  goal: maximize

name: deep_set_attention_hirid_mortality24_supervised

early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  # Training hyperparameters
  train_common.epochs:
    value: 15

  train_common.batch_size:
    values: [16, 32, 64, 128]

  train_common.patience:
    value: 10

  train_common.min_delta:
    value: 1e-4

  # Optimizer hyperparameters
  Adam.lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2

  Adam.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4

  # Model architecture hyperparameters (SEFT-based)
  # Phi network (element-wise encoding)
  DeepSetAttentionModel.seft_n_phi_layers:
    values: [1, 2, 3, 4, 5]

  DeepSetAttentionModel.seft_phi_width:
    values: [16, 32, 64, 128, 256, 512]

  DeepSetAttentionModel.seft_phi_dropout:
    values: [0.0, 0.1, 0.2, 0.3, 0.4]

  # Psi network (set aggregation)
  DeepSetAttentionModel.seft_n_psi_layers:
    values: [1, 2, 3, 4, 5]

  DeepSetAttentionModel.seft_psi_width:
    values: [16, 32, 64, 128, 256, 512]

  DeepSetAttentionModel.seft_psi_latent_width:
    values: [16, 32, 64, 128, 256, 512]

  # Attention mechanism
  DeepSetAttentionModel.seft_dot_prod_dim:
    values: [128, 256, 512]

  DeepSetAttentionModel.heads:
    values: [1, 2, 4]

  DeepSetAttentionModel.attn_dropout:
    values: [0.0, 0.1, 0.2, 0.3, 0.4]

  # Latent representation
  DeepSetAttentionModel.seft_latent_width:
    values: [16, 32, 64, 128, 256, 512]

  # Rho network (final aggregation)
  DeepSetAttentionModel.seft_n_rho_layers:
    values: [1, 2, 3, 4, 5]

  DeepSetAttentionModel.seft_rho_width:
    values: [16, 32, 64, 128, 256, 512]

  DeepSetAttentionModel.seft_rho_dropout:
    values: [0.0, 0.1, 0.2, 0.3, 0.4]

  # Positional encoding
  DeepSetAttentionModel.seft_max_timescales:
    values: [10, 100, 1000]

  DeepSetAttentionModel.seft_n_positional_dims:
    values: [4, 8, 16]

  # Cross-validation settings
  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 1

  execute_repeated_cv.stop_after_first_fold:
    value: True

  # Seed
  seed:
    value: 2222
