# WandB grid sweep for GRUD self-supervised pretraining
# on pooled datasets - simpler configuration for testing

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - ../data/mortality24_from_katja/${dataset_folder}
  - -n
  - ${dataset_name}
  - -t
  - Regression
  - -m
  - SSL_GRUD
  - -gc
  - -lc
  - -s
  - "2222"
  - -l
  - ../yaib_logs_grud_pretraining/
  - --wandb-sweep

method: grid

name: grud_ssl_pretraining_grid

parameters:
  # Pooled datasets - folder and name should match
  dataset_folder:
    values:
      - eicu_miiv_None
      - eicu_mimic_None
      - mimic_miiv_None

  dataset_name:
    values:
      - eicu_miiv
      - eicu_mimic
      - mimic_miiv

  # Model architecture - testing a few key configurations
  SSL_GRUD.recurrent_n_units:
    values: [128, 256]

  SSL_GRUD.dropout:
    values: [0.2, 0.3]

  SSL_GRUD.recurrent_dropout:
    values: [0.2, 0.3]

  SSL_GRUD.pooling:
    values: ["hidden", "mean"]

  # Forecasting settings
  SSL_GRUD.prediction_head_kwargs:
    values:
      - {"sensors_count": 48, "forecast_len": 2}

  # Training settings
  train_common.epochs:
    value: 100

  train_common.batch_size:
    values: [64, 128]

  train_common.patience:
    value: 15

  # Optimizer
  Adam.lr:
    values: [1e-4, 5e-4, 1e-3]

  Adam.weight_decay:
    value: 1e-6

  # Minimal CV for faster pretraining
  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 3

  seed:
    value: 2222
