# Simple WandB sweep for GRUD SSL pretraining
# This uses the --tune flag to let Optuna handle hyperparameter search
# WandB sweep only varies dataset and seed

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - ${data_dir}
  - -n
  - ${dataset_name}
  - -t
  - Regression
  - -m
  - SSL_GRUD
  - -gc
  - -lc
  - -s
  - ${seed}
  - -l
  - ../yaib_logs_grud_pretraining/
  - --wandb-sweep
  - --tune

method: grid

name: grud_ssl_pretraining_simple

parameters:
  # Run on each pooled dataset
  data_dir:
    values:
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/eicu_miiv_None
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/eicu_mimic_None
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/mimic_miiv_None

  dataset_name:
    values:
      - eicu_miiv
      - eicu_mimic
      - mimic_miiv

  # Run with multiple seeds for robustness
  seed:
    values:
      - 2222
      - 3333
      - 4444

  # Optuna tuning parameters (from SSL_GRUD.gin)
  tune_hyperparameters.n_calls:
    value: 20  # Number of Optuna trials

  tune_hyperparameters.n_initial_points:
    value: 5  # Random sampling before Bayesian optimization

  tune_hyperparameters.folds_to_tune_on:
    value: 1  # Tune on 1 fold to save time

  # Training settings
  train_common.epochs:
    value: 100

  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 5
