# WandB sweep configuration for GRUD self-supervised pretraining
# on pooled datasets with forecasting/masked timepoint prediction

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - ${data_dir}
  - -n
  - ${dataset_name}
  - -t
  - Regression
  - -m
  - SSL_GRUD
  - -gc
  - -lc
  - -s
  - "2222"
  - -l
  - ../yaib_logs_grud_pretraining/
  - --wandb-sweep
  - --tune

method: bayes
metric:
  name: avg.mse
  goal: minimize

name: grud_ssl_pretraining_pooled_datasets

parameters:
  # Pooled datasets for pretraining
  data_dir:
    values:
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/eicu_miiv_None
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/eicu_mimic_None
      - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/mimic_miiv_None

  # Dataset name for logging
  dataset_name:
    values:
      - eicu_miiv
      - eicu_mimic
      - mimic_miiv

  # Model architecture hyperparameters
  SSL_GRUD.recurrent_n_units:
    values: [64, 128, 256]

  SSL_GRUD.dropout:
    min: 0.2
    max: 0.4

  SSL_GRUD.recurrent_dropout:
    min: 0.2
    max: 0.4

  SSL_GRUD.pooling:
    values: ["hidden", "mean", "max"]

  # Forecasting head configuration
  SSL_GRUD.prediction_head_kwargs:
    values:
      - {"sensors_count": 48, "forecast_len": 2}
      - {"sensors_count": 48, "forecast_len": 3}
      - {"sensors_count": 48, "forecast_len": 5}

  # Training hyperparameters
  train_common.epochs:
    values: [50, 100, 150]

  train_common.batch_size:
    values: [32, 64, 128]

  train_common.patience:
    value: 15

  train_common.min_delta:
    value: 1e-4

  # Optimizer hyperparameters
  Adam.lr:
    min: 1e-5
    max: 1e-3
    distribution: log_uniform

  Adam.weight_decay:
    values: [1e-6, 1e-5, 1e-4]

  # Cross-validation settings
  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 5

  # Seed
  seed:
    value: 2222
