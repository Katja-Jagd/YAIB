# WandB sweep configuration for IP-Nets supervised learning
# Dataset: HiRID
# Task: Mortality24 (24-hour mortality prediction)
# Model: IP-Nets (Interpolation-Prediction Networks)

program: icu-benchmarks
command:
  - ${env}
  - ${program}
  - train
  - -d
  - /binf-isilon/winthergrp/gsn245/scratch/YAIB/data/mortality24_from_katja/hirid
  - -n
  - hirid
  - -t
  - Mortality24
  - -m
  - IPNets
  - -gc
  - -lc
  - -l
  - ../yaib_logs_ipnets_supervised_hirid_mortality24/
  - --wandb-sweep

method: random
metric:
  name: avg.auroc
  goal: maximize

name: ipnets_hirid_mortality24_supervised

early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  # Training hyperparameters
  train_common.epochs:
    value: 15

  train_common.batch_size:
    values: [4, 8, 16, 32]  # Lower batch sizes due to IP-Nets memory requirements

  train_common.patience:
    value: 10

  train_common.min_delta:
    value: 1e-4

  # Optimizer hyperparameters
  Adam.lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2

  Adam.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4

  # Model architecture hyperparameters (IP-Nets-specific)
  IPNetsModel.recurrent_n_units:
    values: [32, 64, 128, 256]

  IPNetsModel.dropout:
    values: [0.0, 0.1, 0.2, 0.3, 0.4]

  IPNetsModel.recurrent_dropout:
    values: [0.0, 0.1, 0.2, 0.3, 0.4]

  IPNetsModel.pooling:
    values: ["hidden", "mean", "max"]

  # IP-Nets-specific hyperparameters
  IPNetsModel.ipnets_imputation_stepsize:
    values: [0.1, 0.25, 0.5, 1.0]  # inspired by seft

  IPNetsModel.ipnets_reconst_fraction:
    values: [0.005, 0.1, 0.2, 0.5, 0.75] # inspired by seft

  IPNetsModel.reconstruction_loss_weight:
    values: [1.0]  # Weight of reconstruction loss

  # Cross-validation settings
  execute_repeated_cv.cv_repetitions:
    value: 1

  execute_repeated_cv.cv_folds:
    value: 1

  execute_repeated_cv.stop_after_first_fold:
    value: True

  # Seed
  seed:
    value: 2222
